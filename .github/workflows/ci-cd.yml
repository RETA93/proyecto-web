name: CI/CD

on:
  push:
    branches: [develop, qa, main]

jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r backend-python/requirements.txt
      - name: Ejecutar tests
        run: |
          cd backend-python
          python -m pytest || echo "Sin tests todavía"

  test-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Ejecutar tests
        run: |
          cd backend-go
          go test ./... || echo "Sin tests todavía"

  deploy:
    needs: [test-python, test-go]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determinar entorno según la rama
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "name=prod" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "qa" ]; then
            echo "name=qa" >> "$GITHUB_OUTPUT"
          else
            echo "name=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Desplegar por SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/reta/proyecto-web
            git pull origin ${{ github.ref_name }}
            docker compose -f docker-compose.yml -f docker-compose.${{ steps.env.outputs.name }}.yml \
              --env-file .env.${{ steps.env.outputs.name }} up -d --build
