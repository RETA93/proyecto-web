name: CI/CD

on:
  push:
    branches: [develop, qa, main]

jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r backend-python/requirements.txt
      - name: Ejecutar tests
        run: |
          cd backend-python
          python -m pytest || echo "Sin tests todavía"

  test-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Ejecutar tests
        run: |
          cd backend-go
          go test ./... || echo "Sin tests todavía"

  deploy:
    needs: [test-python, test-go]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determinar entorno según la rama
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "name=prod" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "qa" ]; then
            echo "name=qa" >> "$GITHUB_OUTPUT"
          else
            echo "name=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Configurar Cloudflare Tunnel y SSH
        env:
          TARGET_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          sudo mkdir -p /usr/local/bin
          sudo curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared
          
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          
          echo "Host $TARGET_HOST" >> ~/.ssh/config
          echo "  ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %h" >> ~/.ssh/config
          echo "  StrictHostKeyChecking no" >> ~/.ssh/config

      - name: Desplegar por SSH Nativo
        env:
          TARGET_HOST: ${{ secrets.SERVER_HOST }}
          TARGET_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 "$TARGET_USER@$TARGET_HOST" << 'EOF'
            cd /home/reta/proyecto-web
            git pull origin ${{ github.ref_name }}
            docker compose -f docker-compose.yml -f docker-compose.${{ steps.env.outputs.name }}.yml \n              --env-file .env.${{ steps.env.outputs.name }} up -d --build
          EOF
