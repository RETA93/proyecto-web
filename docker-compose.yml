version: "3.9"

networks:
  app-network:
    driver: bridge

volumes:
  mysql-data:

services:
  mysql:
    image: mysql:8.0
    container_name: mysql-${ENV_NAME:-dev}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: dev4264612a
      MYSQL_DATABASE: dev
      MYSQL_USER: reta
      MYSQL_PASSWORD: retadev4264612a
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-pdev4264612a"] # <--- Cambiado aquí también por seguridad del comando
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  backend-python:
    build:
      context: ./backend-python
    container_name: backend-python-${ENV_NAME:-dev}
    restart: unless-stopped
    environment:
      - DATABASE_URL=mysql://reta:retadev4264612a@mysql:3306/dev # <--- Credenciales fijas
      - ENV=${ENV_NAME:-dev}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network

  backend-go:
    build:
      context: ./backend-go
    container_name: backend-go-${ENV_NAME:-dev}
    restart: unless-stopped
    environment:
      - DB_DSN=reta:retadev4264612a@tcp(mysql:3306)/dev # <--- Credenciales fijas
      - ENV=${ENV_NAME:-dev}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
    container_name: frontend-${ENV_NAME:-dev}
    restart: unless-stopped
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx-${ENV_NAME:-dev}
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend-python
      - backend-go
      - frontend
    networks:
      - app-network