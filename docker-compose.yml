version: "3.9"

networks:
  app-network:
    driver: bridge

volumes:
  mysql-data:

services:
  mysql:
    image: mysql:8.0
    container_name: mysql-${ENV_NAME:-dev}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      # Usamos la variable de entorno para autenticar de forma dinámica y segura
      test: ["CMD", "mysqladmin", "ping", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s # Tiempo de gracia crucial para recuperaciones tras apagones

  backend-python:
    build:
      context: ./backend-python
    container_name: backend-python-${ENV_NAME:-dev}
    restart: unless-stopped
    environment:
      - DATABASE_URL=mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      - ENV=${ENV_NAME:-dev}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network

  backend-go:
    build:
      context: ./backend-go
    container_name: backend-go-${ENV_NAME:-dev}
    restart: unless-stopped
    environment:
      - DB_DSN=${MYSQL_USER}:${MYSQL_PASSWORD}@tcp(mysql:3306)/${MYSQL_DATABASE}
      - ENV=${ENV_NAME:-dev}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
    container_name: frontend-${ENV_NAME:-dev}
    restart: unless-stopped
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx-${ENV_NAME:-dev}
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend-python
      - backend-go
      - frontend
    networks:
      - app-network